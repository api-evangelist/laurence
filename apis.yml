aid: laurence
name: Laurence
description: >-
  Laurence is a New York City based Y Combinator (Winter 2026) company that automates Amazon
  advertising and marketplace management for brands. The platform applies quantitative-trading
  methodology — hierarchical Bayesian bid optimization over Amazon Marketing Stream data landed in
  ClickHouse — to maximize contribution margin after margin and ad spend rather than optimizing to
  rules-of-thumb ACOS targets. Laurence ingests Amazon Advertising and Seller Central data, prices
  every keyword auction, and exposes the resulting data to customers through Ask Laurence and a
  hosted, OAuth-protected Model Context Protocol server that brings Amazon Ads data into Claude
  Code, Cursor, and Codex. The company raised a $5.8M seed round led by Susa Ventures and Box Group
  with participation from Y Combinator.
