apis:
- aid: laurence:mcp
  name: Laurence MCP
  description: >-
    Laurence MCP is a hosted, remote Model Context Protocol server that exposes a read-only set of
    nine tools over a customer's Amazon Advertising and Amazon Marketing Stream data — allowed ads
    profiles, daily sales, campaigns, ad groups, keywords, negative keywords, bid observations,
    hourly and daily stream metrics, and search term reports. It is available to Laurence customers,
    is authenticated with OAuth 2.0 (RFC 9728 protected resource, PKCE S256, dynamic client
    registration), and every tool call is scoped to the Amazon Ads profiles the signed-in user
    belongs to.
