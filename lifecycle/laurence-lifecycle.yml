description: >-
  Laurence publishes no versioning policy, no deprecation policy, no SLA and no status page for its
  MCP server. This file records those absences with the probe that established each one, so the gap
  is legible rather than inferred. There is one live change Laurence has NOT documented anywhere: the
  MCP server's canonical resource moved from the modal.run deployment URL to the branded host
  mcp.laurence.com, and the launch post still publishes the old URL in every install command. Both
  hosts answer today, so nothing is broken, but the change was shipped without a changelog entry or
  a note on the post — which is exactly the class of drift a versioning policy exists to make visible.
versioning:
  scheme: none-published
  current: null
  documented: false
  detail: >-
    No API version, no version header, no dated version train. MCP protocol version is negotiated
    per-session by the initialize handshake, which is a protocol mechanic rather than a Laurence
    versioning policy.
deprecation:
  policy_url: null
  documented: false
