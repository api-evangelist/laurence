generated: '2026-08-13'
method: searched
status: published
source: https://www.laurence.com/blog/laurence-mcp-launch
description: 'Laurence operates an official hosted, remote MCP server that brings a customer''s Amazon
  Advertising and Amazon Marketing Stream (AMS) data into Claude Code, Cursor, and Codex. The server is
  available to Laurence customers and is an OAuth 2.0 protected resource (RFC 9728): an unauthenticated
  initialize or tools/list call returns HTTP 401 with a WWW-Authenticate Bearer challenge pointing at
  the protected-resource metadata document. Tools are read-only and backed by Amazon Ads APIs plus pre-stored
  AMS data in ClickHouse. Every tool call is scoped to the Amazon Ads profiles the signed-in user belongs
  to — callers pass a profile_id and the server returns only permitted data. The tool list below was transcribed
  verbatim from the launch post''s Tools table; it could NOT be confirmed against a live tools/list response
  because the endpoint requires OAuth (see verification below).'
server:
  name: laurence
  transport: http
  url: https://mcp.laurence.com/mcp
  aliases:
  - url: https://laurence-ai-68564--ask-laurence-agent-mcp-server.modal.run/mcp
    note: >-
      The Modal deployment URL published in the launch blog post and in every documented install
      command. Still live on 2026-08-13 and returns an identical 401 Bearer challenge, but its own
      RFC 9728 protected-resource metadata declares the resource as https://mcp.laurence.com/mcp.
      The docs have not been updated to the branded host.
  auth: oauth2
  protected_resource: well-known/laurence-oauth-protected-resource.json
  authorization_server: https://www.laurence.com
  scope: laurence:mcp
  read_only: true
  availability: Laurence customers only
verification:
  probed: '2026-08-13'
  probed_hosts:
  - https://mcp.laurence.com/mcp
  - https://laurence-ai-68564--ask-laurence-agent-mcp-server.modal.run/mcp
  initialize_status: 401
  tools_list_status: 401
  www_authenticate: Bearer error="invalid_token", error_description="Authentication required", resource_metadata="https://mcp.laurence.com/.well-known/oauth-protected-resource/mcp"
  tools_verified_live: false
  tools_source: https://www.laurence.com/blog/laurence-mcp-launch
  note: >-
    tools/list is OAuth-gated on both hosts, so per-tool inputSchema could not be introspected. The
    tool names and descriptions below are the provider's own published Tools table; parameter names
    are those the post names in prose. Authenticated introspection would be required to capture the
    real JSON Schemas.
install:
- client: claude-code
  command: claude mcp add --transport http laurence https://laurence-ai-68564--ask-laurence-agent-mcp-server.modal.run/mcp
- client: codex
  command: codex mcp add laurence --url https://laurence-ai-68564--ask-laurence-agent-mcp-server.modal.run/mcp
- client: codex
  config: |
    [mcp_servers.laurence]
    url = "https://laurence-ai-68564--ask-laurence-agent-mcp-server.modal.run/mcp"
  login: codex mcp login laurence --scopes laurence:mcp
- client: cursor
  config: '{"laurence":{"command":"npx","args":["-y","mcp-remote","https://laurence-ai-68564--ask-laurence-agent-mcp-server.modal.run/mcp"]}}'
  note: >-
    mcp-remote is a third-party stdio-to-HTTP bridge, not a Laurence package. Laurence publishes no
    package of its own on any registry — see packages/laurence-packages.yml.
tools:
- name: list_allowed_ads_profiles
  description: Every Amazon Ads profile_id you may query (call first). Every other tool expects a profile_id
    from this list.
- name: get_daily_sales
  description: Daily units and revenue by profile; optional ASIN filter.
- name: get_campaigns
  description: Campaigns for a profile (SP, SB, SD).
- name: get_ad_groups
  description: Ad groups for a campaign.
- name: get_campaign_keywords
  description: Keywords and bids for campaign IDs.
- name: get_campaign_negative_keywords
  description: Negative keywords for ad group IDs.
- name: get_bids_and_observations
  description: Bid updates with the same-hour performance snapshot (metrics when present). Optional keyword_id,
    campaign_ids, Pacific date bounds, and row limit.
- name: get_ams_events
  description: Sponsored Products stream metrics (Pacific). Pick granularity via interval (daily rollups
    per Pacific day, or hourly raw rows capped by limit). Optional match_type, placement, keyword_id,
    and campaign_ids.
- name: get_search_term_data
  description: Search term report (queries and attributed performance). Optional keyword_id, campaign_ids,
    and limit.
notes:
- Laurence positions this server as complementary to Amazon's own Ads MCP Server (launched February 2026,
  50+ tools), which does not cover Amazon Marketing Stream — the hourly event firehose of impressions,
  clicks, cost, conversions, and placements at keyword granularity.
- Queries are served from pre-stored ClickHouse data rather than on-demand Amazon report generation; Laurence
  claims responses over 5x faster than Amazon report generation and polling.
- Authentication is a browser-based OAuth sign-in on first tool invocation; sessions persist in the IDE
  afterward with no manual token wiring.
- No tool crosswalk is emitted for Laurence — a crosswalk binds MCP tools to backing OpenAPI operationIds,
  and Laurence publishes no OpenAPI to bind against.
deployment:
  mode: remote
  endpoint: https://mcp.laurence.com/mcp
  auth: oauth
  verified: probed
  probe: gated
  probe_status: 401
  checked: '2026-08-13'
  note: >-
    Remote only. No stdio package exists — the Cursor install path shells out to the third-party
    mcp-remote bridge rather than to a Laurence-published npm or PyPI package.
