description: >-
  Laurence documents no rate limits for its MCP server, and none could be observed. The launch post
  — the only published document describing the server — covers install, auth and the tool table but
  says nothing about quotas, throttling or backoff. The endpoint is OAuth-gated, so an
  unauthenticated probe cannot reach a rate-limited code path: every request returns 401 before any
  limit would apply, and the 401 response carries no RateLimit-*, X-RateLimit-* or Retry-After
  header. An agent calling this server therefore has no runtime signal to pace against and no
  documented number to plan against. limit_count is zero as a measured fact.
