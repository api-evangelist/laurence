notes:
  - >-
    modal-function-call-id is a per-invocation trace identifier emitted by the Modal serverless
    platform the server runs on. It is a request-correlation value, not a rate-limit signal, and it
    is not documented by Laurence.
  - >-
    The one implicit throughput control the docs do describe is a per-tool row "limit" parameter on
    get_bids_and_observations, get_ams_events and get_search_term_data — a result-size cap, not a
    request-rate limit. See conventions/laurence-conventions.yml.
  - >-
    Any upstream Amazon Advertising API quota that constrains Laurence's own ingestion is not
    surfaced to MCP callers and is not documented here, since Laurence publishes nothing about it.
